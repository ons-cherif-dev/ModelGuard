name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Installer les dépendances
        run: pip install -r requirements-api.txt pytest httpx

      - name: Lancer les tests
        run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Construire l'image Docker
        run: docker build -t modelguard-api .

      - name: Test de fumée du conteneur
        run: |
          docker run -d --name api -p 8000:8000 modelguard-api
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000/health && break || sleep 2
          done
          curl -sf http://127.0.0.1:8000/health | grep '"model_loaded":true'
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"temperature": 80, "vibration": 22}' | grep '"anomalie":true'

      - name: Logs du conteneur (si échec)
        if: failure()
        run: docker logs api